<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 简约 DNA 双螺旋 · 金色渐变描边 -->
  <defs>
    <linearGradient id="helixGoldA" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8BE6A"/>
      <stop offset="0.5" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B4443C" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="helixGoldB" x1="0" y1="400" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8BE6A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- 两条主链：正弦双螺旋 -->
  <path d="M110 20 C 290 70, 290 130, 110 180 C -70 230, -70 290, 110 340 C 200 365 250 375 290 380"
        transform="translate(45 0)" stroke="url(#helixGoldA)" stroke-width="7" stroke-linecap="round"/>
  <path d="M290 20 C 110 70, 110 130, 290 180 C 470 230, 470 290, 290 340 C 200 365 150 375 110 380"
        transform="translate(-45 0)" stroke="url(#helixGoldB)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- 横向碱基对连接 -->
  <g stroke="#E8BE6A" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <line x1="150" y1="52" x2="250" y2="52"/>
    <line x1="128" y1="96" x2="272" y2="96"/>
    <line x1="122" y1="140" x2="278" y2="140"/>
    <line x1="128" y1="184" x2="272" y2="184"/>
    <line x1="150" y1="228" x2="250" y2="228"/>
    <line x1="128" y1="272" x2="272" y2="272"/>
    <line x1="122" y1="316" x2="278" y2="316"/>
    <line x1="150" y1="352" x2="250" y2="352"/>
  </g>
  <!-- 节点 -->
  <g fill="#D9A441">
    <circle cx="150" cy="52" r="5"/>
    <circle cx="250" cy="52" r="5"/>
    <circle cx="128" cy="140" r="5"/>
    <circle cx="278" cy="140" r="5"/>
    <circle cx="150" cy="228" r="5"/>
    <circle cx="250" cy="228" r="5"/>
    <circle cx="128" cy="316" r="5"/>
    <circle cx="278" cy="316" r="5"/>
  </g>
</svg>
