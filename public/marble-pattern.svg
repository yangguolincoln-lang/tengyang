    <circle cx="420" cy="160" r="3.5"/>
    <circle cx="820" cy="210" r="2.5"/>
    <circle cx="460" cy="340" r="3"/>
    <circle cx="960" cy="80" r="2.5"/>
    <circle cx="530" cy="400" r="3.5"/>
