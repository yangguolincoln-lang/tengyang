    <path d="M-20 260 C170 310 330 210 510 260 C690 310 770 220 950 270 C1070 302 1140 260 1220 280" stroke-width="1.2" opacity="0.75"/>
    <path d="M-20 400 C190 450 350 350 530 400 C710 450 790 360 970 410 C1090 442 1160 400 1220 420" stroke-width="2.2" opacity="0.9"/>
    <path d="M-20 540 C210 590 370 490 550 540 C730 590 810 500 990 550 C1110 582 1180 540 1220 560" stroke-width="1.4" opacity="0.65"/>
  </g>
